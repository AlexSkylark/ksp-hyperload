// T-Minus profiler settings.
// Read directly at startup (not through GameDatabase), so ModuleManager patches
// do not apply here. Kept in PluginData so that editing it never invalidates
// ModuleManager's cache.

TMINUS_PROFILER
{
  // Master switch. false = no hooks, no output.
  enabled = true

  // Hook groups. Each can be turned off if it causes trouble.

  // Startup: loader start times, config scans and reads, part compilation,
  // drag cubes.
  startupHooks = true

  // Awake cost of every [KSPAddon], per scene.
  addonHooks = true

  // Scene transitions: request to "ready" per scene, buffered load steps
  // (asset unload + GC), save load/write, ScenarioModule load per module,
  // terrain start per body.
  sceneHooks = true

  // Total time per GameEvent dispatch (all subscribed handlers, mods
  // included). Dispatches over 50 ms are also recorded individually.
  eventHooks = true

  // PartModule and VesselModule code: Load, Awake, OnStart and OnStartFinished
  // per module type, module start and saved-part load per part, and vessel
  // loads (by vessel type; slow ones with their part count).
  moduleHooks = true

  // Harmony: time to apply and remove patches (Harmony rebuilds and compiles
  // the whole patched method each time), per mod and per patched method.
  harmonyHooks = true

  // Output, not a hook: at the main menu and after each scene transition,
  // write the key numbers (long frames, costliest addons, part compilation
  // by mod) to KSP.log, so sharing KSP.log alone shares them too.
  logSummary = true

  // Start() cost of every [KSPAddon], per scene. This patches mods' own Start
  // methods, lazily: only once the game has created the addon, so its static
  // constructor has already run. The one difference from vanilla: each Start
  // is compiled up to one frame earlier. Cost on a 180-mod install: ~0.7 s of
  // Harmony patching per session, spread over each scene's first load
  // (docs/m6-web-plan.md, "Order decided"). Requires addonHooks.
  addonStartHooks = true

  // OFF BY DEFAULT. At the main menu, list every method Harmony has patched and
  // the mods (Harmony ids) that patch it, into the profiler's output file.
  // Read only, but reading every patch takes time at the moment the main menu
  // becomes ready: leave it off for timing runs.
  patchInventory = false

  // DIAGNOSTIC, OFF BY DEFAULT. Per-call time of other mods' Harmony patches:
  // every method another mod patches gets T-Minus brackets around all of its
  // patches (time added by the patches, and the method's own body). This
  // patches those methods once more (two rebuilds each, a few milliseconds per
  // frame until done) and adds a small cost to every call: never enable it for
  // benchmark or overhead runs. Requires harmonyHooks.
  harmonyCallHooks = false

  // OFF BY DEFAULT until its cost is measured. Time in every coroutine step,
  // per enumerator type, the game's and mods'. Each type's MoveNext is patched
  // lazily, when its first coroutine starts, just before its first step runs.
  // Expected cost: about 150 types on a 180-mod install, a few milliseconds of
  // Harmony patching each, spread over each scene's first load.
  coroutineHooks = false
}
